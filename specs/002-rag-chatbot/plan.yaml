# =============================================================================
# KEY DESIGN DECISIONS
# =============================================================================

design_decisions:
  - id: "DD-001"
    title: "Multi-Agent Architecture"
    decision: "Use UserAgent + ContentAgent separation"
    rationale: |
      - Clear separation of concerns (interaction vs. content)
      - UserAgent can handle non-content queries without invoking RAG
      - Easier to extend with additional agents later
    alternatives_considered:
      - "Single monolithic handler"
      - "Function-based routing without agents"
    rejected_because: "Less modular, harder to maintain and extend"

  - id: "DD-002"
    title: "In-Memory Session Storage"
    decision: "Store session/conversation history in-memory, not Postgres"
    rationale: |
      - Faster access for conversation context
      - Reduces Postgres load (free tier limits)
      - Sessions are ephemeral (30 min timeout)
      - Only log aggregates to Postgres
    alternatives_considered:
      - "Full session history in Postgres"
      - "Redis cache layer"
    rejected_because: "Adds complexity and cost for ephemeral data"

  - id: "DD-003"
    title: "Local Embedding Generation"
    decision: "Use sentence-transformers locally instead of API"
    rationale: |
      - Zero cost (vs. OpenAI embeddings API)
      - No rate limits
      - all-MiniLM-L6-v2 is fast on CPU
      - Consistent embeddings between indexing and query
    alternatives_considered:
      - "OpenAI text-embedding-3-small"
      - "Cohere embed API"
    rejected_because: "Violates free-tier constraint"

  - id: "DD-004"
    title: "Qdrant Cloud over ChromaDB"
    decision: "Use Qdrant Cloud free tier"
    rationale: |
      - Managed service (no infrastructure)
      - 1M vector free tier is generous
      - Better performance than ChromaDB
      - Payload filtering for chapter/section
    alternatives_considered:
      - "ChromaDB (self-hosted)"
      - "Pinecone free tier"
    rejected_because: "ChromaDB needs hosting; Pinecone has lower limits"

  - id: "DD-005"
    title: "Groq for LLM"
    decision: "Use Groq free tier with llama-3.1-8b-instant"
    rationale: |
      - Generous free tier (30 req/min)
      - Fast inference
      - Llama 3.1 8B is capable for RAG
      - Easy fallback to Ollama for local dev
    alternatives_considered:
      - "Together.ai"
      - "Self-hosted Ollama only"
    rejected_because: "Together requires credit card; Ollama needs local GPU"

  - id: "DD-006"
    title: "Rule-Based Intent Classification"
    decision: "Use rule-based + keyword matching for intent"
    rationale: |
      - Simple and deterministic
      - No additional LLM call needed
      - Fast execution
      - Easy to debug and maintain
    alternatives_considered:
      - "LLM-based classification"
      - "Fine-tuned classifier model"
    rejected_because: "Adds latency and complexity; overkill for 6 intents"

# =============================================================================
# INTERFACES & API CONTRACTS
# =============================================================================

api_contracts:
  chat_endpoint:
    path: "/api/v1/chat"
    method: "POST"
    request:
      headers:
        Content-Type: "application/json"
      body:
        type: "object"
        required: ["session_id", "message"]
        properties:
          session_id:
            type: "string"
            format: "uuid"
            example: "123e4567-e89b-12d3-a456-426614174000"
          message:
            type: "string"
            maxLength: 1000
            example: "What is inverse kinematics?"
          selected_text:
            type: "string"
            maxLength: 2000
            example: "The Denavit-Hartenberg convention..."
          current_page:
            type: "string"
            example: "/docs/module-2-digital-twin/kinematics"
    response:
      success:
        status: 200
        body:
          type: "object"
          properties:
            session_id:
              type: "string"
              format: "uuid"
            response:
              type: "object"
              properties:
                answer:
                  type: "string"
                sources:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      chapter: { type: "string" }
                      section: { type: "string" }
                      relevance_score: { type: "number" }
                confidence:
                  type: "number"
                  minimum: 0
                  maximum: 1
            intent:
              type: "string"
              enum: ["content_query", "selection_query", "clarification", "greeting", "help", "out_of_scope"]
            processing_time_ms:
              type: "integer"
      errors:
        - status: 400
          body:
            error: "validation_error"
            detail: "Message is required"
        - status: 429
          body:
            error: "rate_limit_exceeded"
            retry_after: 60
        - status: 503
          body:
            error: "service_unavailable"
            detail: "LLM service temporarily unavailable"

  session_endpoint:
    path: "/api/v1/session"
    method: "POST"
    request:
      body:
        type: "object"
        properties:
          initial_page:
            type: "string"
            example: "/docs/intro"
    response:
      success:
        status: 201
        body:
          session_id:
            type: "string"
            format: "uuid"
          expires_at:
            type: "string"
            format: "datetime"

  health_endpoint:
    path: "/api/v1/health"
    method: "GET"
    response:
      success:
        status: 200
        body:
          status: "healthy"
          version: "1.0.0"
          dependencies:
            neon: "connected"
            qdrant: "connected"
            embedding_model: "loaded"

# =============================================================================
# NON-FUNCTIONAL REQUIREMENTS
# =============================================================================

nfr_implementation:
  performance:
    - requirement: "p95 latency < 3000ms"
      implementation:
        - "Connection pooling for Neon and Qdrant"
        - "Model preloading at startup"
        - "Async API handlers"
        - "Limit chat history to last 5 messages for context"

    - requirement: "10 concurrent users"
      implementation:
        - "Uvicorn with 4 workers"
        - "In-memory session storage"
        - "Async database operations"

  reliability:
    - requirement: "99% uptime"
      implementation:
        - "Health check endpoint for orchestrator"
        - "Graceful degradation on LLM failure"
        - "Retry logic with exponential backoff"
        - "Circuit breaker for external services"

  security:
    - requirement: "Input sanitization"
      implementation:
        - "Pydantic validation on all inputs"
        - "Max length limits on message and selected_text"
        - "HTML escaping for responses"
        - "No SQL injection via parameterized queries"

    - requirement: "CORS restriction"
      implementation:
        - "Allow only book domain origin"
        - "Credentials not required (no auth)"

  cost:
    - requirement: "Zero monthly cost"
      implementation:
        - "Neon free tier monitoring"
        - "Qdrant usage tracking"
        - "Groq rate limit awareness"
        - "Local embedding model"

# =============================================================================
# RISKS & MITIGATIONS
# =============================================================================

risks:
  - id: "RISK-001"
    description: "Free tier rate limits may be insufficient"
    probability: "Medium"
    impact: "Medium"
    mitigation:
      - "Implement request queuing"
      - "Show user-friendly rate limit messages"
      - "Cache common queries (future enhancement)"
    monitoring: "Track Groq rate limit headers"

  - id: "RISK-002"
    description: "LLM hallucination despite RAG"
    probability: "Low"
    impact: "High"
    mitigation:
      - "Strict system prompt constraints"
      - "Require source citations"
      - "Confidence threshold (reject < 0.5)"
      - "Retrieved chunk display for verification"
    monitoring: "Log and review low-confidence responses"

  - id: "RISK-003"
    description: "Cold start latency"
    probability: "High"
    impact: "Low"
    mitigation:
      - "Model preloading at container start"
      - "Connection keep-alive"
      - "User feedback ('Waking up...')"
    monitoring: "Track first-request latency"

  - id: "RISK-004"
    description: "Poor retrieval quality"
    probability: "Medium"
    impact: "Medium"
    mitigation:
      - "Chunk overlap for context continuity"
      - "Relevance threshold (0.7)"
      - "Query rewriting for better matching"
      - "Manual evaluation of retrieval quality"
    monitoring: "Log top_chunk_score distribution"

# =============================================================================
# IMPLEMENTATION PHASES
# =============================================================================

implementation_phases:
  phase_1:
    name: "Core RAG Pipeline"
    duration_estimate: "Foundation phase"
    deliverables:
      - task: "Project setup and dependencies"
        files:
          - "backend/requirements.txt"
          - "backend/Dockerfile"
          - "backend/.env.example"

      - task: "TextEmbedder tool"
        files:
          - "backend/app/tools/text_embedder.py"
          - "backend/tests/unit/test_text_embedder.py"

      - task: "Qdrant setup and RAGRetriever"
        files:
          - "backend/app/db/qdrant.py"
          - "backend/app/tools/rag_retriever.py"
          - "backend/scripts/setup_qdrant.py"
          - "backend/tests/unit/test_rag_retriever.py"

      - task: "Book indexing script"
        files:
          - "backend/scripts/index_book.py"
          - "backend/tests/integration/test_indexing.py"

      - task: "Basic FastAPI with health endpoint"
        files:
          - "backend/main.py"
          - "backend/app/api/routes/health.py"
          - "backend/app/config.py"

    success_criteria:
      - "Embedding model loads and generates vectors"
      - "Book content indexed in Qdrant"
      - "Query retrieves relevant chunks"
      - "Health endpoint returns 200"

  phase_2:
    name: "Agent Orchestration"
    duration_estimate: "Core logic phase"
    dependencies: ["phase_1"]
    deliverables:
      - task: "BaseAgent and orchestrator"
        files:
          - "backend/app/agents/base.py"
          - "backend/app/agents/orchestrator.py"

      - task: "UserAgent with intent classification"
        files:
          - "backend/app/agents/user_agent.py"
          - "backend/app/services/intent_classifier.py"
          - "backend/tests/unit/test_user_agent.py"

      - task: "ContentAgent with LLM integration"
        files:
          - "backend/app/agents/content_agent.py"
          - "backend/app/services/llm_client.py"
          - "backend/tests/unit/test_content_agent.py"

      - task: "Session management"
        files:
          - "backend/app/services/session_manager.py"

      - task: "Neon Postgres integration"
        files:
          - "backend/app/db/neon.py"
          - "backend/app/db/models.py"
          - "backend/scripts/setup_neon.py"

      - task: "Chat and session endpoints"
        files:
          - "backend/app/api/routes/chat.py"
          - "backend/app/api/routes/session.py"
          - "backend/app/api/schemas/chat.py"
          - "backend/app/api/schemas/session.py"
          - "backend/tests/integration/test_chat_endpoint.py"

    success_criteria:
      - "UserAgent classifies intents correctly"
      - "ContentAgent generates cited responses"
      - "Session maintains conversation context"
      - "Chat endpoint returns valid responses"

  phase_3:
    name: "Frontend Integration"
    duration_estimate: "UI phase"
    dependencies: ["phase_2"]
    deliverables:
      - task: "ChatWidget React component"
        files:
          - "website/src/components/ChatWidget/index.tsx"
          - "website/src/components/ChatWidget/ChatWidget.tsx"
          - "website/src/components/ChatWidget/ChatWindow.tsx"
          - "website/src/components/ChatWidget/ChatInput.tsx"
          - "website/src/components/ChatWidget/MessageBubble.tsx"
          - "website/src/components/ChatWidget/SourceCitation.tsx"
          - "website/src/components/ChatWidget/types.ts"

      - task: "Text selection handler"
        files:
          - "website/src/hooks/useTextSelection.ts"
          - "website/src/components/ChatWidget/SelectionContext.tsx"

      - task: "Chat API client and hooks"
        files:
          - "website/src/services/chatApi.ts"
          - "website/src/hooks/useChat.ts"
          - "website/src/hooks/useSession.ts"

      - task: "Styling"
        files:
          - "website/src/components/ChatWidget/ChatWidget.module.css"

      - task: "Docusaurus integration"
        files:
          - "website/src/theme/Root.js"
          - "website/docusaurus.config.js (modification)"

    success_criteria:
      - "Chat widget appears on all book pages"
      - "Text selection captures content"
      - "Messages sent and responses displayed"
      - "Sources link to book sections"

  phase_4:
    name: "Polish & Deployment"
    duration_estimate: "Finalization phase"
    dependencies: ["phase_3"]
    deliverables:
      - task: "Error handling and edge cases"
        files:
          - "backend/app/core/exceptions.py"
          - "backend/app/api/middleware/rate_limit.py"
          - "backend/app/api/middleware/cors.py"

      - task: "Logging and monitoring"
        files:
          - "backend/app/core/logging.py"

      - task: "Deployment configuration"
        files:
          - "backend/Dockerfile (refinement)"
          - "scripts/deploy.sh"
          - "railway.json or render.yaml"

      - task: "Documentation"
        files:
          - "README.md (update)"
          - "backend/README.md"

    success_criteria:
      - "All edge cases handled gracefully"
      - "Deployed and accessible"
      - "Health checks passing"
      - "Documentation complete"

# =============================================================================
# APPENDIX: ENVIRONMENT VARIABLES
# =============================================================================

appendix:
  environment_variables:
    required:
      - name: "NEON_DATABASE_URL"
        description: "Neon Postgres connection string"
        example: "postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/dbname?sslmode=require"

      - name: "QDRANT_URL"
        description: "Qdrant Cloud cluster URL"
        example: "https://xxx-xxx.us-east4-0.gcp.cloud.qdrant.io"

      - name: "QDRANT_API_KEY"
        description: "Qdrant Cloud API key"
        example: "qdrant_api_key_here"

      - name: "GROQ_API_KEY"
        description: "Groq API key"
        example: "gsk_xxx"

    optional:
      - name: "EMBEDDING_MODEL"
        description: "Sentence-transformers model name"
        default: "sentence-transformers/all-MiniLM-L6-v2"

      - name: "LLM_MODEL"
        description: "Groq model name"
        default: "llama-3.1-8b-instant"

      - name: "CORS_ORIGINS"
        description: "Allowed CORS origins (comma-separated)"
        default: "http://localhost:3000"

      - name: "LOG_LEVEL"
        description: "Logging level"
        default: "INFO"

      - name: "SESSION_TIMEOUT_MINUTES"
        description: "Session inactivity timeout"
        default: "30"
