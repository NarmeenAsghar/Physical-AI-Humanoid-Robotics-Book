# =============================================================================
# RAG Chatbot Architectural Plan
# =============================================================================
# Feature: Retrieval-Augmented Generation Chatbot
# Branch: 002-rag-chatbot
# Created: 2025-12-16
# Status: Draft
# Spec Reference: specs/002-rag-chatbot/spec.yaml
# Spec-Kit Plus Compatible: v1.0
# =============================================================================

metadata:
  plan_name: "RAG Book Chatbot Implementation Plan"
  feature_id: "002-rag-chatbot"
  version: "1.0.0"
  created: "2025-12-16"
  status: "draft"
  spec_reference: "specs/002-rag-chatbot/spec.yaml"
  authors:
    - name: "AI System Architect"
      role: "Plan Author"

# =============================================================================
# SUMMARY
# =============================================================================

summary:
  primary_requirement: |
    Build a RAG chatbot embedded in a Docusaurus book that answers questions
    exclusively from the book's content, supporting text selection context.

  technical_approach: |
    Multi-agent architecture with FastAPI backend, Qdrant vector store for
    semantic search, Neon Postgres for metadata/analytics, and sentence-transformers
    for local embedding generation. Frontend React component integrated into
    Docusaurus theme.

# =============================================================================
# TECHNICAL CONTEXT
# =============================================================================

technical_context:
  language_version: "Python 3.11+"
  primary_dependencies:
    - "FastAPI 0.109+"
    - "sentence-transformers 2.3+"
    - "qdrant-client 1.7+"
    - "psycopg[binary] 3.1+"
    - "groq 0.4+"
    - "pydantic 2.5+"
  storage:
    primary: "Neon Serverless Postgres (Free Tier)"
    vector: "Qdrant Cloud (Free Tier)"
  testing: "pytest with pytest-asyncio"
  target_platform: "Linux container (Railway/Render)"
  project_type: "web"
  performance_goals:
    - "p95 latency < 3000ms"
    - "10 concurrent users"
    - "Embedding generation < 100ms"
  constraints:
    - "Zero monthly cost (free tier only)"
    - "512MB Neon storage limit"
    - "1M Qdrant vectors limit"
    - "30 Groq requests/minute"
    - "CPU-only inference"
  scale_scope:
    - "~100-500 book chunks indexed"
    - "~50-100 daily active users"
    - "30-minute session timeout"

# =============================================================================
# CONSTITUTION CHECK
# =============================================================================

constitution_check:
  gates:
    - gate: "Accuracy"
      status: "PASS"
      notes: "RAG ensures answers from book content only; citation required"

    - gate: "Clarity"
      status: "PASS"
      notes: "API contracts and data models well-defined"

    - gate: "Reproducibility"
      status: "PASS"
      notes: "All components use open-source, versioned dependencies"

    - gate: "Rigor"
      status: "PASS"
      notes: "Semantic retrieval with relevance scoring ensures quality"

    - gate: "Spec-First Workflow"
      status: "PASS"
      notes: "Spec created before plan; tasks will follow"

# =============================================================================
# SYSTEM ARCHITECTURE
# =============================================================================

architecture:
  overview: |
    The system follows a layered architecture with clear separation:
    1. Presentation Layer (Docusaurus React Component)
    2. API Layer (FastAPI endpoints)
    3. Agent Layer (UserAgent, ContentAgent orchestration)
    4. Tool Layer (RAGRetriever, TextEmbedder)
    5. Data Layer (Qdrant vectors, Neon Postgres metadata)

  components:
    frontend:
      name: "Docusaurus Chat Widget"
      type: "React Component"
      description: "Floating chat interface integrated into book pages"
      responsibilities:
        - "Render chat UI with message history"
        - "Capture text selection from book content"
        - "Send messages to backend API"
        - "Display responses with source citations"
        - "Manage local session state"
      technologies:
        - "React 18+"
        - "TypeScript"
        - "CSS Modules or Tailwind"
        - "Docusaurus swizzled theme component"

    api_gateway:
      name: "FastAPI Backend"
      type: "REST API"
      description: "Handles HTTP requests, validation, and response formatting"
      responsibilities:
        - "Request validation (Pydantic)"
        - "Session management"
        - "Rate limiting"
        - "CORS handling"
        - "Health checks"
        - "Error formatting"
      endpoints:
        - "POST /api/v1/chat"
        - "POST /api/v1/session"
        - "GET /api/v1/health"

    agent_orchestrator:
      name: "Agent Orchestrator"
      type: "Python Module"
      description: "Coordinates agent execution flow"
      responsibilities:
        - "Route requests to appropriate agent"
        - "Manage agent execution pipeline"
        - "Handle agent errors gracefully"
        - "Collect metrics"

    user_agent:
      name: "UserAgent"
      type: "Agent"
      description: "Entry point for all user interactions"
      responsibilities:
        - "Intent classification"
        - "Session context management"
        - "Routing to ContentAgent"
        - "Handle non-content queries (greetings, help)"
      dependencies:
        - "SessionManager"
        - "IntentClassifier"
        - "ContentAgent"

    content_agent:
      name: "ContentAgent"
      type: "Agent"
      description: "Handles book content queries"
      responsibilities:
        - "Query understanding and rewriting"
        - "Orchestrate retrieval pipeline"
        - "Generate responses with citations"
        - "Confidence scoring"
      dependencies:
        - "TextEmbedder"
        - "RAGRetriever"
        - "LLMClient"

    text_embedder:
      name: "TextEmbedder"
      type: "Tool"
      description: "Converts text to vector embeddings"
      responsibilities:
        - "Load and cache embedding model"
        - "Preprocess text (normalize, truncate)"
        - "Generate 384-dim embeddings"
        - "Batch processing for indexing"
      dependencies:
        - "sentence-transformers"

    rag_retriever:
      name: "RAGRetriever"
      type: "Tool"
      description: "Retrieves relevant content chunks"
      responsibilities:
        - "Query Qdrant with embeddings"
        - "Apply score thresholds and filters"
        - "Return ranked chunks with metadata"
        - "Handle connection errors"
      dependencies:
        - "QdrantClient"

    llm_client:
      name: "LLMClient"
      type: "Service"
      description: "Interfaces with Groq LLM API"
      responsibilities:
        - "Construct prompts with retrieved context"
        - "Call Groq API"
        - "Parse and validate responses"
        - "Handle rate limits"
      dependencies:
        - "groq"

    session_manager:
      name: "SessionManager"
      type: "Service"
      description: "Manages chat sessions"
      responsibilities:
        - "Create/retrieve sessions"
        - "Store conversation history (in-memory)"
        - "Handle session timeouts"
        - "Log session metrics to Postgres"
      dependencies:
        - "NeonClient"

    neon_client:
      name: "NeonClient"
      type: "Data Access"
      description: "Postgres database operations"
      responsibilities:
        - "Connection pooling"
        - "CRUD for content_chunks metadata"
        - "CRUD for chat_sessions"
        - "Query logging"
      dependencies:
        - "psycopg"

    qdrant_client:
      name: "QdrantClient"
      type: "Data Access"
      description: "Vector store operations"
      responsibilities:
        - "Collection management"
        - "Vector upsert/search"
        - "Payload filtering"
      dependencies:
        - "qdrant-client"

# =============================================================================
# DATA FLOW DIAGRAMS
# =============================================================================

data_flows:
  # ---------------------------------------------------------------------------
  # Main Query Flow
  # ---------------------------------------------------------------------------
  query_flow:
    name: "User Query to Response"
    description: "Complete flow from user question to chatbot response"
    steps:
      - step: 1
        actor: "User"
        action: "Types question in chat widget"
        data: "{ message: string, selected_text?: string }"
        target: "Frontend"

      - step: 2
        actor: "Frontend"
        action: "Sends POST request to /api/v1/chat"
        data: |
          {
            session_id: UUID,
            message: string,
            selected_text?: string,
            current_page?: string
          }
        target: "FastAPI"

      - step: 3
        actor: "FastAPI"
        action: "Validates request, invokes UserAgent"
        data: "ChatRequest (Pydantic model)"
        target: "UserAgent"

      - step: 4
        actor: "UserAgent"
        action: "Classifies intent"
        data: "{ message, context, history }"
        target: "IntentClassifier"
        outputs:
          - intent: "content_query | selection_query | clarification | greeting | help | out_of_scope"

      - step: 5
        actor: "UserAgent"
        action: "Routes to ContentAgent (if content-related)"
        data: "{ query, context, chat_history }"
        target: "ContentAgent"
        condition: "intent in ['content_query', 'selection_query', 'clarification']"

      - step: 6
        actor: "ContentAgent"
        action: "Generates query embedding"
        data: "query_text: string"
        target: "TextEmbedder"
        outputs:
          - embedding: "list[float] (384 dims)"

      - step: 7
        actor: "ContentAgent"
        action: "Retrieves relevant chunks"
        data: |
          {
            query_embedding: list[float],
            top_k: 5,
            score_threshold: 0.7,
            filters?: { chapter?, section? }
          }
        target: "RAGRetriever"
        outputs:
          - chunks: "list[RetrievedChunk]"

      - step: 8
        actor: "RAGRetriever"
        action: "Queries Qdrant vector store"
        data: "SearchRequest with embedding + filters"
        target: "Qdrant Cloud"
        outputs:
          - results: "list[ScoredPoint]"

      - step: 9
        actor: "ContentAgent"
        action: "Constructs prompt with retrieved context"
        data: |
          {
            system_prompt: string,
            user_query: string,
            retrieved_chunks: list[RetrievedChunk]
          }
        target: "LLMClient"

      - step: 10
        actor: "LLMClient"
        action: "Calls Groq API"
        data: "ChatCompletion request"
        target: "Groq API"
        outputs:
          - completion: "string"

      - step: 11
        actor: "ContentAgent"
        action: "Formats response with citations"
        data: "raw_response + chunk_metadata"
        target: "self"
        outputs:
          - response: |
              {
                answer: string,
                sources: list[Source],
                confidence: float,
                is_from_book: boolean
              }

      - step: 12
        actor: "UserAgent"
        action: "Updates session, logs query"
        data: "response + metrics"
        target: "SessionManager, NeonClient"

      - step: 13
        actor: "FastAPI"
        action: "Returns JSON response"
        data: "ChatResponse"
        target: "Frontend"

      - step: 14
        actor: "Frontend"
        action: "Renders response with sources"
        data: "ChatResponse"
        target: "User"

  # ---------------------------------------------------------------------------
  # Text Selection Flow
  # ---------------------------------------------------------------------------
  selection_flow:
    name: "Text Selection Context"
    description: "How selected text is captured and used"
    steps:
      - step: 1
        actor: "User"
        action: "Selects text in book content"
        data: "DOM Selection event"
        target: "Frontend"

      - step: 2
        actor: "Frontend"
        action: "Captures selection, shows context indicator"
        data: "selected_text: string"
        target: "ChatWidget state"

      - step: 3
        actor: "User"
        action: "Types 'explain this'"
        data: "{ message, selected_text }"
        target: "Frontend"

      - step: 4
        actor: "Frontend"
        action: "Includes selected_text in request"
        data: "ChatRequest with selected_text field"
        target: "FastAPI"

      - step: 5
        actor: "UserAgent"
        action: "Detects selection_query intent"
        data: "message + presence of selected_text"
        target: "IntentClassifier"

      - step: 6
        actor: "ContentAgent"
        action: "Combines selection with query for embedding"
        data: "query_rewrite(message, selected_text)"
        target: "TextEmbedder"

  # ---------------------------------------------------------------------------
  # Indexing Flow (Batch)
  # ---------------------------------------------------------------------------
  indexing_flow:
    name: "Book Content Indexing"
    description: "Batch process to index book content"
    steps:
      - step: 1
        actor: "Indexer Script"
        action: "Reads book markdown files"
        data: "docs/**/*.md"
        target: "Filesystem"

      - step: 2
        actor: "Indexer Script"
        action: "Chunks content with overlap"
        data: "markdown_content"
        target: "Chunker"
        outputs:
          - chunks: "list[ContentChunk]"

      - step: 3
        actor: "Indexer Script"
        action: "Generates embeddings (batch)"
        data: "list[chunk_text]"
        target: "TextEmbedder.generate_embeddings_batch"
        outputs:
          - embeddings: "list[list[float]]"

      - step: 4
        actor: "Indexer Script"
        action: "Upserts to Qdrant"
        data: "list[PointStruct]"
        target: "Qdrant Cloud"

      - step: 5
        actor: "Indexer Script"
        action: "Stores metadata in Postgres"
        data: "list[ContentChunkRecord]"
        target: "Neon Postgres"

# =============================================================================
# AGENT INTERACTIONS
# =============================================================================

agent_interactions:
  # ---------------------------------------------------------------------------
  # UserAgent Internal Flow
  # ---------------------------------------------------------------------------
  user_agent_flow:
    name: "UserAgent Processing"
    components:
      intent_classifier:
        type: "Internal Component"
        method: "Rule-based + keyword matching"
        logic: |
          1. Check for greeting keywords → intent: greeting
          2. Check for help keywords → intent: help
          3. Check if selected_text present + short query → intent: selection_query
          4. Check chat_history for recent topic + short query → intent: clarification
          5. Check query against book topic keywords → intent: content_query
          6. Default → intent: out_of_scope

      session_context:
        type: "In-Memory Store"
        structure: |
          {
            session_id: UUID,
            created_at: datetime,
            last_activity: datetime,
            messages: list[Message],
            current_page: string | null
          }

      routing_rules:
        - intent: "content_query"
          route: "ContentAgent.handle_query"
          pass_context: "chat_history (last 5 messages)"

        - intent: "selection_query"
          route: "ContentAgent.handle_query"
          pass_context: "selected_text + chat_history"

        - intent: "clarification"
          route: "ContentAgent.handle_query"
          pass_context: "chat_history (last 10 messages)"

        - intent: "greeting"
          route: null
          response: "static greeting message"

        - intent: "help"
          route: null
          response: "static help message"

        - intent: "out_of_scope"
          route: null
          response: "static out-of-scope message"

  # ---------------------------------------------------------------------------
  # ContentAgent Internal Flow
  # ---------------------------------------------------------------------------
  content_agent_flow:
    name: "ContentAgent Processing"
    pipeline:
      - stage: "Query Preparation"
        steps:
          - "Combine user query with selected_text (if any)"
          - "Apply query rewriting for better retrieval"
          - "Generate embedding via TextEmbedder"

      - stage: "Retrieval"
        steps:
          - "Call RAGRetriever with embedding"
          - "Apply score threshold (0.7)"
          - "Return top-k (default 5) chunks"

      - stage: "Context Construction"
        steps:
          - "Format retrieved chunks into context string"
          - "Include chapter/section metadata"
          - "Build system prompt with constraints"

      - stage: "Generation"
        steps:
          - "Send prompt to LLM via LLMClient"
          - "Parse response"
          - "Extract/verify source citations"

      - stage: "Response Formatting"
        steps:
          - "Structure answer with sources"
          - "Calculate confidence score"
          - "Set is_from_book flag"

    tool_usage:
      text_embedder:
        when: "Query preparation stage"
        input: "Combined query string"
        output: "384-dim embedding vector"

      rag_retriever:
        when: "Retrieval stage"
        input: "Embedding + filters + top_k + threshold"
        output: "Ranked list of content chunks"

